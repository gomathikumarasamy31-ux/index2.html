
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ffb6d9, #87cefa, #c4b5fd);
            min-height: 100vh;
            margin: 0;
            padding: 40px 15px;
            box-sizing: border-box;
        }

        .box {
            background-color: white;
            padding: 25px;
            width: 320px;
            max-width: 100%;
            margin: 30px auto;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        h2 {
            color: #8b3dba;
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            width: 100%;
            margin-bottom: 12px;
            border: 1px solid #c4b5fd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #ec4899;
            box-shadow: 0 0 5px #f9a8d4;
        }

        button {
            background: linear-gradient(90deg, #ec4899, #6366f1);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.85;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
            color: #6d28d9;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Grade Calculator</h2>

        <input type="number" id="mark1"
               placeholder="Enter mark 1" min="0" max="100">

        <input type="number" id="mark2"
               placeholder="Enter mark 2" min="0" max="100">

        <input type="number" id="mark3"
               placeholder="Enter mark 3" min="0" max="100">

        <input type="number" id="mark4"
               placeholder="Enter mark 4" min="0" max="100">

        <input type="number" id="mark5"
               placeholder="Enter mark 5" min="0" max="100">

        <button onclick="grade()">Calculate Grade</button>

        <p id="result"></p>
    </div>

    <script>
        const marks = [
            "mark1",
            "mark2",
            "mark3",
            "mark4",
            "mark5"
        ];

        marks.forEach((id, index) => {
            document.getElementById(id).addEventListener(
                "keydown", function(event) {

                    if (event.key === "Enter") {
                        event.preventDefault();

                        if (this.value === "" ||
                            this.value < 0 ||
                            this.value > 100) {
                            alert("Enter a mark between 0 and 100.");
                            this.focus();
                            return;
                        }

                        if (index < marks.length - 1) {
                            document.getElementById(
                                marks[index + 1]
                            ).focus();
                        } else {
                            grade();
                        }
                    }
                }
            );
        });

        function grade() {
            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);
            let mark4 = Number(document.getElementById("mark4").value);
            let mark5 = Number(document.getElementById("mark5").value);

            let values = [mark1, mark2, mark3, mark4, mark5];

            for (let i = 0; i < values.length; i++) {
                let input = document.getElementById(marks[i]);

                if (input.value.trim() === "" ||
                    values[i] < 0 ||
                    values[i] > 100) {
                    alert("Please enter all five marks between 0 and 100.");
                    input.focus();
                    return;
                }
            }

            let sum = mark1 + mark2 + mark3 + mark4 + mark5;
            let avg = sum / 5;
            let result = "";

            if (avg >= 90) {
                result = "Your grade is A";
            }
            else if (avg >= 80) {
                result = "Your grade is B";
            }
            else if (avg >= 70) {
                result = "Your grade is C";
            }
            else if (avg >= 50) {
                result = "Your grade is D";
            }
            else {
                result = "Your grade is F";
            }

            document.getElementById("result").innerHTML =
                "Total: " + sum +
                "<br>Average: " + avg.toFixed(2) +
                "<br>" + result;
        }
    </script>

</body>
</html>
